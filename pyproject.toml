[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-maker-orchestrator"
version = "0.1.0"
description = "ADAPTIX: provider-agnostic adaptive execution engine for capability-driven workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
adaptix = "loop_maker.cli:adaptix_main"
adaptix-mcp = "loop_maker.mcp_server:main"
loop-maker = "loop_maker.cli:main"
loop-maker-mcp = "loop_maker.mcp_server:main"

[project.entry-points."loop_maker.agents"]
# Third-party agent adapters register here.

[project.entry-points."loop_maker.evaluators"]
# One default evidence-backed evaluator may be registered here.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
