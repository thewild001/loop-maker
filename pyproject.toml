[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-maker-orchestrator"
version = "0.1.0"
description = "Agent-agnostic iteration, evaluation and recovery engine for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
loop-maker = "loop_maker.cli:main"
loop-maker-mcp = "loop_maker.mcp_server:main"

[project.entry-points."loop_maker.agents"]
# Third-party adapters register here.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
